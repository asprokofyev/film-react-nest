upstream backend {
    server backend:3000;
}

server {
    listen 80;
    server_name asprokofyev.student.nomorepartiessite.ru;

    client_max_body_size 50M;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Здоровье сервера
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Статические файлы бэкенда (загруженные файлы)
    location /content/ {
        alias /usr/share/nginx/html/content/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # API запросы
    location /api/afisha/ {
        proxy_pass http://backend/api/afisha/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Фронтенд (статический сайт)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Кэширование для статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
